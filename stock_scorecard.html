<!DOCTYPE html>
<html>
<head>

<title>Stock Exit Scorecard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body{
font-family:Arial;
background:#f7f7f7;
}

.container{
max-width:900px;
margin-top:25px;
background:white;
padding:18px;
border-radius:6px;
}

h2{
font-size:20px;
margin-bottom:2px;
}

.subtitle{
color:#777;
font-size:12px;
margin-bottom:12px;
}

.section-title{
font-size:13px;
font-weight:bold;
margin-top:10px;
margin-bottom:4px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px 10px;
}

.field{
display:flex;
flex-direction:column;
}

label{
font-size:11px;
margin-bottom:1px;
color:#555;
}

input,select{
height:26px !important;
font-size:12px !important;
padding:2px 6px !important;
}

button{
margin-top:12px;
}

.result{
margin-top:15px;
padding:10px;
border:1px solid #eee;
}

.score{
font-size:24px;
font-weight:bold;
}

.verdict{
font-size:15px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>Stock Exit Scorecard</h2>
<div class="subtitle">Run after quarterly earnings</div>


<div class="section-title">Growth & Efficiency</div>

<div class="grid">

<div class="field">
<label>Revenue %</label>
<input id="revenue" class="form-control">
</div>

<div class="field">
<label>ROCE %</label>
<input id="roce" class="form-control">
</div>

<div class="field">
<label>Margin YoY %</label>
<input id="margin" class="form-control">
</div>

</div>



<div class="section-title">Valuation</div>

<div class="grid">

<div class="field">
<label>Sector</label>
<select id="sector" class="form-control">
<option value="tech">IT / Tech</option>
<option value="bank">Banks / Financials</option>
<option value="manufacturing">Manufacturing / Defense</option>
<option value="consumer">Consumer / Retail</option>
</select>
</div>

<div class="field">
<label>P/E</label>
<input id="pe" class="form-control">
</div>

<div class="field">
<label>P/B</label>
<input id="pb" class="form-control">
</div>

<div class="field">
<label>PEG</label>
<input id="peg" class="form-control">
</div>

<div class="field">
<label>P/S</label>
<input id="ps" class="form-control">
</div>

<div class="field">
<label>Sector P/S Avg</label>
<input id="sectorPs" class="form-control">
</div>

<div class="field">
<label>5Y Median P/E</label>
<input id="peMedian" class="form-control">
</div>

</div>



<div class="section-title">Balance Sheet</div>

<div class="grid">

<div class="field">
<label>Debt / Eq</label>
<input id="debt" class="form-control">
</div>

<div class="field">
<label>Pledge %</label>
<input id="pledge" class="form-control">
</div>

<div class="field">
<label>Stake Δ %</label>
<input id="stake" class="form-control">
</div>

</div>



<div class="section-title">Market</div>

<div class="grid">

<div class="field">
<label>Drop from High %</label>
<input id="priceDrop" class="form-control">
</div>

<div class="field">
<label>1Y Return %</label>
<input id="price1yr" class="form-control">
</div>

<div class="field">
<label>Moat Weak</label>
<select id="moat" class="form-control">
<option value="0">No</option>
<option value="15">Yes</option>
</select>
</div>

</div>



<div class="section-title">Value Cushion</div>

<div class="grid">

<div class="field">
<label>Dividend %</label>
<input id="dividend" class="form-control">
</div>

<div class="field">
<label>Cash %</label>
<input id="cash" class="form-control">
</div>

</div>


<button onclick="calculateScore()" class="btn btn-primary btn-sm">
Calculate
</button>


<div id="result" class="result"></div>

</div>



<script>

function valuationScore(){

let sector = sector.value

let pe = parseFloat(document.getElementById("pe").value) || 0
let pb = parseFloat(document.getElementById("pb").value) || 0
let peg = parseFloat(document.getElementById("peg").value) || 0
let ps = parseFloat(document.getElementById("ps").value) || 0
let sectorPs = parseFloat(document.getElementById("sectorPs").value) || 0
let peMedian = parseFloat(document.getElementById("peMedian").value) || 0

let score = 0


if(sector=="tech"){

if(peg < 1) score+=0
else if(peg <=1.5) score+=10
else score+=20

if(ps > 2*sectorPs) score+=5

}


if(sector=="bank"){

if(pb <2) score+=0
else if(pb<=4) score+=10
else score+=20

if(pe > 1.5*peMedian) score+=5

}


if(sector=="manufacturing"){

if(pe <15) score+=0
else if(pe<=30) score+=10
else score+=20

if(pb >3) score+=5

}


if(sector=="consumer"){

if(pe <25) score+=0
else if(pe<=50) score+=10
else score+=20

if(peg >1.5) score+=5

}

return Math.min(score,25)

}



function calculateScore(){

let score=0

let revenue=parseFloat(revenue.value)||0
let roce=parseFloat(roce.value)||0
let margin=parseFloat(margin.value)||0

let debt=parseFloat(debt.value)||0
let pledge=parseFloat(pledge.value)||0
let stake=parseFloat(stake.value)||0

let priceDrop=parseFloat(priceDrop.value)||0
let price1yr=parseFloat(price1yr.value)||0

let pe=parseFloat(pe.value)||0
let pb=parseFloat(pb.value)||0
let dividend=parseFloat(dividend.value)||0
let cash=parseFloat(cash.value)||0

let moatScore=parseFloat(moat.value)



/* Growth */

if(revenue <8) score+=25
else if(revenue<12) score+=10

if(roce<15) score+=10

if(margin<-3) score+=5



/* Valuation */

score += valuationScore()



/* Balance */

if(debt>0.5) score+=10
if(pledge>20) score+=10
if(stake<-2) score+=5



/* Market */

if(priceDrop>40 && revenue<12) score+=10
else if(priceDrop>25 && revenue<12) score+=5



/* Value Cushion */

if(pe<15 || pb<2) score-=5
if(dividend>3) score-=5
if(cash>30) score-=5



/* Winner momentum */

if(price1yr>25) score-=5



/* Moat */

score+=moatScore



/* Verdict */

let verdict=""

if(score<=25) verdict="💎 Diamond Hands"
else if(score<=45) verdict="👀 Watch"
else if(score<=65) verdict="⚠️ Trim 50%"
else verdict="❌ Exit"



result.innerHTML=`
<div class="score">${score}/100</div>
<div class="verdict">${verdict}</div>
`

}

</script>

</body>
</html>
