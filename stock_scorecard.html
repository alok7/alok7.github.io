<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stock Scorecard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body{
font-size:14px;
background:#f7f8fa;
padding:20px;
}

.container-box{
max-width:900px;
margin:auto;
background:white;
padding:18px 22px;
border-radius:6px;
box-shadow:0 1px 5px rgba(0,0,0,0.08);
}

h4{
margin-bottom:16px;
font-weight:600;
}

.section-title{
font-size:13px;
font-weight:600;
color:#6c757d;
margin-top:12px;
margin-bottom:6px;
text-transform:uppercase;
}

.row{
margin-bottom:6px;
}

input, select{
height:30px !important;
font-size:13px !important;
}

label{
font-size:13px;
margin-bottom:2px;
}

.help{
cursor:pointer;
font-size:11px;
margin-left:4px;
color:#6c757d;
}

.tooltip-inner{
font-size:11px;
padding:5px 7px;
max-width:200px;
background:#2f3640;
}

.tooltip.bs-tooltip-top .arrow::before{
border-top-color:#2f3640;
}

.result{
margin-top:16px;
font-weight:600;
}

.score{
font-size:20px;
font-weight:700;
}

.verdict{
font-size:16px;
}

</style>
</head>

<body>

<div class="container-box">

<h4>Stock Scorecard</h4>

<div class="section-title">Quality</div>

<div class="row">
<div class="col-md-4">
<label>
ROCE %
<span class="help" data-toggle="tooltip"
title="Return on capital employed. Measures capital efficiency.">ⓘ</span>
</label>
<input id="roce" class="form-control">
</div>

<div class="col-md-4">
<label>
Operating Margin %
<span class="help" data-toggle="tooltip"
title="Operating profit margin from latest results.">ⓘ</span>
</label>
<input id="margin" class="form-control">
</div>

<div class="col-md-4">
<label>
Margin YoY Decline %
<span class="help" data-toggle="tooltip"
title="Operating margin drop compared to last year.">ⓘ</span>
</label>
<input id="marginDecline" class="form-control">
</div>
</div>


<div class="section-title">Growth</div>

<div class="row">
<div class="col-md-4">
<label>
Revenue Growth YoY %
<span class="help" data-toggle="tooltip"
title="Revenue growth compared to same quarter last year.">ⓘ</span>
</label>
<input id="revenue" class="form-control">
</div>

<div class="col-md-4">
<label>
EPS Growth YoY %
<span class="help" data-toggle="tooltip"
title="Earnings per share growth vs last year.">ⓘ</span>
</label>
<input id="eps" class="form-control">
</div>

<div class="col-md-4">
<label>
PE Ratio
<span class="help" data-toggle="tooltip"
title="Current price to earnings ratio.">ⓘ</span>
</label>
<input id="pe" class="form-control">
</div>
</div>


<div class="section-title">Valuation</div>

<div class="row">
<div class="col-md-4">
<label>
PEG Ratio
<span class="help" data-toggle="tooltip"
title="PE divided by earnings growth.">ⓘ</span>
</label>
<input id="peg" class="form-control">
</div>

<div class="col-md-4">
<label>
Debt / Equity
<span class="help" data-toggle="tooltip"
title="Financial leverage ratio.">ⓘ</span>
</label>
<input id="debt" class="form-control">
</div>

<div class="col-md-4">
<label>
Drop from High %
<span class="help" data-toggle="tooltip"
title="Decline from the 52-week high.">ⓘ</span>
</label>
<input id="priceDrop" class="form-control">
</div>
</div>


<div class="section-title">Risk Signals</div>

<div class="row">
<div class="col-md-4">
<label>
Promoter Δ (1Y)
<span class="help" data-toggle="tooltip"
title="Δ = Change in promoter holding over the last 1 year. Negative value means promoters reduced stake.">ⓘ</span>
</label>
<input id="promoter" class="form-control">
</div>

<div class="col-md-4">
<label>
Moat Weakening?
<span class="help" data-toggle="tooltip"
title="Signs the company's competitive advantage is deteriorating.">ⓘ</span>
</label>
<select id="moat" class="form-control">
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>
</div>


<button class="btn btn-primary btn-sm mt-2" onclick="computeScore()">Compute Score</button>

<div class="result">

<div class="score">
Score: <span id="score">0</span>
</div>

<div class="verdict">
Verdict: <span id="verdict">-</span>
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

$(function () {
$('[data-toggle="tooltip"]').tooltip({
trigger:'hover',
placement:'top',
delay:{show:200,hide:100}
})
})

function val(id){
return parseFloat(document.getElementById(id).value)||0
}

function computeScore(){

let score = 0


// ================= QUALITY =================

let roce = val("roce")
if(roce > 20) score += 3
else if(roce > 15) score += 2
else if(roce > 10) score += 1

let margin = val("margin")
if(margin > 25) score += 2
else if(margin > 15) score += 1

let marginDecline = val("marginDecline")
if(marginDecline > 5) score -= 2
else if(marginDecline > 2) score -= 1



// ================= GROWTH =================

let revenue = val("revenue")
if(revenue > 20) score += 3
else if(revenue > 10) score += 2
else if(revenue > 5) score += 1

let eps = val("eps")
if(eps > 20) score += 3
else if(eps > 10) score += 2
else if(eps > 5) score += 1



// ================= VALUATION =================

let pe = val("pe")
if(pe < 20) score += 2
else if(pe < 30) score += 1

let peg = val("peg")
if(peg < 1) score += 2
else if(peg < 1.5) score += 1



// ================= RISK =================

let promoter = val("promoter")
if(promoter < 0) score -= 2

let moat = parseFloat(document.getElementById("moat").value)
if(moat === 1) score -= 2

let debt = val("debt")
if(debt > 1) score -= 2
else if(debt > 0.5) score -= 1

let drop = val("priceDrop")
if(drop > 40) score += 2
else if(drop > 20) score += 1



// ================= FINAL VERDICT =================

document.getElementById("score").innerText = score

let verdict = "Avoid"

if(score >= 14) verdict = "Strong Buy"
else if(score >= 10) verdict = "Buy"
else if(score >= 6) verdict = "Hold"
else if(score >= 3) verdict = "Weak Hold"

document.getElementById("verdict").innerText = verdict

}

</script>

</body>
</html>
