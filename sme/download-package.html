<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete research package — Wallstrat</title><style>body{font:17px/1.6 system-ui;max-width:760px;margin:3rem auto;padding:1rem;color:#18232d}button,a{font:inherit}button{padding:.7rem 1rem}#status{white-space:pre-wrap}</style><h1>Complete research package</h1><p>This download reconstructs the original, complete ZIP from ordered parts. Every part and the complete ZIP are checked with SHA-256 before saving. No research data is omitted or changed.</p><p><a href="../sme.html">← Company index</a></p><button id="download">Download verified ZIP</button><button id="cancel" hidden>Cancel download</button><p id="status" role="status">Ready.</p><noscript>JavaScript is required to reconstruct this package. The full report remains readable from the company index.</noscript><script>
'use strict';
const button=document.getElementById('download'),status=document.getElementById('status'),cancel=document.getElementById('cancel');let controller;cancel.addEventListener('click',()=>controller?.abort());
const company=new URLSearchParams(location.search).get('company');
const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
async function get(url){const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Download failed ('+r.status+'). Please retry.');return r;}
button.addEventListener('click',async()=>{button.disabled=true;cancel.hidden=false;controller=new AbortController();let objectURL;try{
 if(!/^[A-Z0-9]{12}$/.test(company||''))throw Error('Invalid company address.');
 if(!globalThis.crypto?.subtle)throw Error('Use a current browser on the secure website.');
 status.textContent='Reading package manifest…';const m=await(await get('reports/'+company+'.zip-manifest.json')).json();
 if(m.format!=='wallstrat-exact-zip-parts-v1'||m.filename!==company+'.zip'||!Number.isSafeInteger(m.bytes)||m.bytes<1||m.bytes>100000000||!/^[a-f0-9]{64}$/.test(m.sha256)||!Array.isArray(m.parts)||m.parts.length<1||m.parts.length>30)throw Error('Invalid package manifest.');
 const chunks=[];let total=0;
 for(let i=0;i<m.parts.length;i++){const p=m.parts[i],expected=company+'.zip.'+String(i).padStart(3,'0')+'.zippart';if(p.path!==expected||!Number.isSafeInteger(p.bytes)||p.bytes<1||p.bytes>4000000||!/^[a-f0-9]{64}$/.test(p.sha256))throw Error('Invalid part manifest.');status.textContent='Downloading and verifying part '+(i+1)+' of '+m.parts.length+'…';const b=await(await get('reports/'+p.path)).arrayBuffer();if(b.byteLength!==p.bytes||await hash(b)!==p.sha256)throw Error('Part integrity check failed. Please retry.');chunks.push(b);total+=b.byteLength;}
 if(total!==m.bytes)throw Error('Package length mismatch.');status.textContent='Verifying the complete ZIP…';const bytes=new Uint8Array(total);let at=0;for(const b of chunks){bytes.set(new Uint8Array(b),at);at+=b.byteLength;}if(await hash(bytes)!==m.sha256)throw Error('Complete ZIP integrity check failed.');controller.signal.throwIfAborted();objectURL=URL.createObjectURL(new Blob([bytes],{type:'application/zip'}));const a=document.createElement('a');a.href=objectURL;a.download=m.filename;document.body.appendChild(a);a.click();a.remove();status.textContent='Verified complete ZIP. Your download has started.';setTimeout(()=>URL.revokeObjectURL(objectURL),60000);
 }catch(e){status.textContent=e.name==='AbortError'?'Download cancelled. You can retry.':e.message;}finally{button.disabled=false;cancel.hidden=true;}});
</script></html>
